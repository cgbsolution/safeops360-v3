name: CI

# Static-analysis gate for the FastAPI backend. It deliberately does NOT run
# pytest yet: the suite currently binds to whatever DATABASE_URL is configured,
# which per the project's own notes is the LIVE production Supabase database.
# Enable the pytest job below only after test-DB isolation (a TEST_DATABASE_URL
# branch in app/core/db.py + a SAVEPOINT-rollback conftest) lands — see the
# audit's Testing-2 finding.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e . || pip install .
          pip install ruff mypy

      - name: Syntax gate (blocking)
        run: python -m compileall -q app

      - name: Ruff lint (non-blocking until lint debt is cleared)
        run: ruff check .
        continue-on-error: true

      - name: Mypy (non-blocking until typing is completed)
        run: mypy app
        continue-on-error: true

